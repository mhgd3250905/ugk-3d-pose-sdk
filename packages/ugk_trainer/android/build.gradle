// Same shape as wakelock_plus 1.8.1 (works with the apps' AGP 9 +
// android.builtInKotlin=false and with AGP 8).
plugins {
    id 'com.android.library'
}

// Conditionally apply KGP only if AGP version is earlier than 9.
def agpMajor = com.android.Version.ANDROID_GRADLE_PLUGIN_VERSION.tokenize('.')[0] as int
if (agpMajor < 9) {
    project.pluginManager.apply('org.jetbrains.kotlin.android')
}

group 'com.ugk.trainer'
version '0.1.0'

android {
    namespace 'com.ugk.trainer'
    compileSdk = flutter.compileSdkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        minSdkVersion flutter.minSdkVersion
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}
