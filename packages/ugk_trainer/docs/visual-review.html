<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>训练播放页 · 视觉对照</title><style>
:root{font-family:system-ui,sans-serif;color:#172d2d;background:#edf2f2}*{box-sizing:border-box}body{margin:0;padding:32px 20px}main{max-width:1080px;margin:auto}h1{font-size:28px;font-weight:650;margin:0 0 10px}p{line-height:1.7;color:#52666b}.controls{display:flex;gap:12px;flex-wrap:wrap;margin:24px 0}label{display:flex;align-items:center;gap:8px}select{font:inherit;border:1px solid #b7c6c7;background:#fff;border-radius:12px;padding:12px}.pair{display:grid;grid-template-columns:1fr 1fr;gap:24px}figure{margin:0}figcaption{padding:12px 0;font-size:14px}img{display:block;width:100%;border-radius:22px;box-shadow:0 12px 40px #163b3720}small{display:block;line-height:1.6;color:#607075;margin-top:24px}@media(max-width:620px){body{padding:20px 12px}.pair{gap:10px}h1{font-size:24px}}body.dark{background:#10191e;color:#edf4f4}body.dark p,body.dark small{color:#a9b8bf}
</style><main><h1>训练播放页 · 视觉对照</h1><p>同一假数据、视口与时间点。左侧为 ugk_trainer-v0.2.9，右侧为待审候选。<br>这是 Flutter 软件测试渲染，原生视频、GPU 光学与帧率需要真机验收。</p><div class="controls"><label>状态<select id="state"><option value="training">训练中</option><option value="rest">休息</option><option value="transition">换侧</option><option value="result">结果</option></select></label><label>主题<select id="mode"><option value="light">浅色</option><option value="dark">深色</option></select></label></div><div class="pair"><figure><figcaption>改造前 · v0.2.9</figcaption><img id="before" alt="改造前播放器"></figure><figure><figcaption>候选 · 待开哥评审</figcaption><img id="after" alt="候选播放器"></figure></div><small>人物为示例原创透明矢量图；结果用短流程真实生成，因此显示 0 分钟。截图未包含示例工具栏。此页面只查看静态对照，交互验收请运行 ../example。</small></main><script>
const state=document.getElementById('state'),mode=document.getElementById('mode');function show(){for(const side of ['before','after'])document.getElementById(side).src=`visuals/${side}-${state.value}-${mode.value}.png`;document.body.classList.toggle('dark',mode.value==='dark')}state.addEventListener('change',show);mode.addEventListener('change',show);show();
</script></html>
