name: ugk_trainer
description: >-
  三 App（FlareLab 托马斯 / HipLab / SmartFit）共用的跟练模块：TrainingPlan 引擎、
  动作节奏 Rhythm、语音队列与素材源、安卓训练保活、训练播放页与训练结果。
version: 0.1.6
repository: https://github.com/mhgd3250905/ugk-3d-pose-sdk
publish_to: none

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  ugk_coach:
    path: ../..
  # Same pinned versions as HipLab / SmartFit / 3D-Body.
  just_audio: 0.10.6
  audio_session: 0.2.4
  webview_flutter: 4.14.1
  webview_flutter_android: 4.14.1
  webview_flutter_wkwebview: 3.26.2
  wakelock_plus: 1.8.1
  web: ^1.1.1
  clock: ^1.1.2
  crypto: 3.0.7
  path_provider: 2.1.6
  connectivity_plus: 7.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.ugk.trainer
        pluginClass: UgkTrainerPlugin
  assets:
    - assets/silence.m4a
    - assets/media_player/
