include: package:lints/recommended.yaml

analyzer:
  exclude:
    # Flutter packages with their own analysis (packages/ugk_trainer).
    - packages/**
  language:
    strict-casts: true
    strict-raw-types: true

linter:
  rules:
    - prefer_final_locals
    - prefer_single_quotes
    - avoid_dynamic_calls
    - unawaited_futures
    - directives_ordering
