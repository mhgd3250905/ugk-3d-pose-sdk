name: ugk_trainer
description: Compatibility exports and historical full action assets for ugk_trainer_runtime.
version: 0.6.0
repository: https://github.com/mhgd3250905/ugk-3d-pose-sdk
publish_to: none

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  ugk_trainer_runtime:
    path: ../ugk_trainer_runtime

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  ugk_coach:
    path: ../..
  audio_session: 0.2.4
  clock: ^1.1.2
  crypto: 3.0.7
  just_audio: 0.10.6
  webview_flutter: 4.14.1

flutter:
  shaders:
    - shaders/packed_alpha.frag
  assets:
    - assets/silence.m4a
    - assets/media_player/
    - assets/pose_hub/app-pack-r2-v10/catalog.json
    - assets/pose_hub/app-pack-r2-v10/catalog/catalog.json
    - assets/pose_hub/app-pack-r2-v10/standing/
    - assets/pose_hub_player/
